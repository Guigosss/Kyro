<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<body>
    <main layout:fragment="content">
        <h1 th:text="|Session details : ${workoutSession.nom}|"></h1>

        <div>
            <p th:text="|Date : ${workoutSession.date}|"></p>
            <p th:text="|Notes : ${workoutSession.notes}|"></p>
        </div>

        <div>
            <h1>Workout Sets</h1>
            <div th:each="set, statut : ${sets}">
                <h2 th:text></h2>
            </div>
        </div>

        <a th:href="@{/}">Back</a>
    </main>
</body>

</html>
